# =============================================================================
#  PROJETS STORM
# =============================================================================
#  Source : feuille de route 2026, pôle Quantification des risques.
#  Pour ajouter un projet : copier un bloc. Pour le retirer d'un axe : changer
#  « axe ». Pour changer son état : changer « statut ».
#
#  Champs :
#    title        nom du projet (obligatoire — c'est le champ que Quarto trie)
#    title_en     même chose en anglais
#    axe          credit | climat | geopolitique | methodes   (un seul)
#    statut       a-demarrer | en-cours | relecture | termine
#    statut_fr / statut_en   libellé affiché
#    horizon      T1..T4, ou vide
#    resume_fr/en 1 à 2 phrases
#    equipe       liste de noms, tels qu'écrits dans membres.yml
#    livrables    note | article | outil | fiche-reflexe | formation
#    note         chemin vers la note associée, ou vide
#    path         laisser vide : les projets n'ont pas de page propre pour l'instant
# =============================================================================

