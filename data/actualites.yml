# =============================================================================
#  ACTUALITÉS — tout ce qui n'est pas une note technique
# =============================================================================
#  Les notes techniques (fr/notes/*.qmd) apparaissent toutes seules dans les
#  Actualités : inutile de les recopier ici. Ce fichier sert pour le reste :
#  publications, interventions, conférences, séminaires, presse…
#
#  Pour ajouter une actualité : copier un bloc, remplir, enregistrer. Le tri
#  se fait automatiquement par « date » (du plus récent au plus ancien).
#
#  Champs :
#    type       publication | intervention | evenement | presse
#               (le libellé affiché — « Publication », « Intervention »… — est
#               choisi automatiquement, en français et en anglais)
#    etiquette / etiquette_en   facultatif : remplace le libellé automatique
#               (ex. « Article soumis », « Séminaire »)
#    title      titre en français (obligatoire)
#    title_en   titre en anglais (facultatif : sinon le titre français)
#    qui        qui intervient / qui part / les auteurs (ex. "Yoann Pull")
#    date       AAAA-MM-JJ
#    lieu / lieu_en   revue, conférence, ville… (une ligne courte)
#    path       lien : page du site (/fr/…) ou adresse externe (https://…)
#    path_en    facultatif : lien pour l'édition anglaise
#
#  Exemple d'intervention (retirer les « # » pour l'activer) :
#
# - type: "intervention"
#   title: "Stress tests de crédit : propager la distribution"
#   title_en: "Credit stress testing: propagating the distribution"
#   qui: "Prénom Nom"
#   date: "2026-11-20"
#   lieu: "Conférence XYZ, Paris"
#   lieu_en: "XYZ Conference, Paris"
#   path: "https://exemple.org/programme"
# =============================================================================

